name: Build desktop packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            architecture: x64
            artifact: desktop-windows-x64
          - name: macOS Apple Silicon
            runner: macos-15
            architecture: arm64
            artifact: desktop-macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - name: Check out shared source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: ${{ matrix.architecture }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Validate and build from clean staging
        run: python build_desktop.py --output-dir release
      - name: Retain packages and source manifests
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.zip
            release/*.build-manifest.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish complete desktop update
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-artifacts
      - name: Publish packages and update manifest atomically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python publish_update.py release-artifacts
